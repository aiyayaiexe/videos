<!DOCTYPE html>
<head>
  <title>My YouTube Diary :p</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      color: #234b70;
      background: linear-gradient(#8ed6ff, #eafaff 65%, #b8e7ff);
    }

    .topBit {
      max-width: 950px;
      margin: 0 auto;
      padding: 8px;
      background: linear-gradient(white, #a8dfff);
      border: 2px solid #75bce9;
      border-radius: 14px;
      box-shadow: 0 5px 15px #579bc766;
    }

    .bar {
      padding: 8px 12px;
      margin-bottom: 8px;
      background: linear-gradient(white, #c7eaff);
      border: 1px solid #9bcce9;
      border-radius: 8px;
      color: #4d7fa0;
      font-size: 13px;
    }

    header {
      padding: 18px;
      background: linear-gradient(#65c6ff, #258fe0 55%, #1675c6);
      color: white;
      border: 2px solid white;
      border-radius: 10px;
      text-shadow: 1px 2px 2px #2873a8;
    }

    header h1 {
      margin: 0 0 5px;
      font-size: 30px;
    }

    .layout {
      display: flex;
      gap: 12px;
      margin-top: 12px;
    }

    aside {
      width: 190px;
      flex-shrink: 0;
    }

    .side-title {
      padding: 10px;
      color: white;
      font-weight: bold;
      background: linear-gradient(#64c8ff, #1685d4);
      border: 1px solid white;
    }

    .side-note {
      padding: 12px;
      margin-bottom: 10px;
      background: linear-gradient(white, #d9f2ff);
      border: 1px solid #9bcce9;
      font-size: 13px;
      line-height: 1.5;
    }

    main {
      flex: 1;
      min-width: 0;
      padding: 14px;
      background: #ffffff;
      border: 2px solid #9bcce9;
      box-shadow: inset 0 0 8px #d2efff;
    }

    h2 {
      margin: 0 0 12px;
      color: #2586c7;
      font-size: 21px;
    }

    .controls {
      padding: 12px;
      margin-bottom: 14px;
      background: linear-gradient(white, #d7f0ff);
      border: 1px solid #a5d3ef;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: bold;
    }

    input, button {
      box-sizing: border-box;
      padding: 9px 12px;
      font: inherit;
      border: 1px solid #70b6e5;
      border-radius: 5px;
    }

    input {
      max-width: 100%;
      background: white;
      color: #234b70;
    }

    button {
      margin-left: 5px;
      color: white;
      font-weight: bold;
      background: linear-gradient(white 0%, #78d0ff 15%, #218de0 55%, #1269b8 100%);
      border: 1px solid #2478b5;
      text-shadow: 1px 1px #27699a;
      cursor: pointer;
      box-shadow: inset 0 1px 2px white;
    }

    button:hover {
      background: linear-gradient(white, #58baff 20%, #0874c9);
    }

    #message {
      padding: 10px;
      margin: 0 0 12px;
      background: #eef9ff;
      border: 1px solid #b4dff5;
      font-size: 14px;
    }

    #video {
      padding: 8px;
      background: linear-gradient(#d7efff, #f8fdff);
      border: 1px solid #8bc9ee;
    }

    iframe {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      border: 2px solid #5ca9dc;
      background: #d5eefa;
    }

    @media (max-width: 620px) {
      body { padding: 8px; }
      .layout { display: block; }
      aside { width: auto; }
      main { margin-top: 10px; }
      input, button { margin: 4px 0; }
    }
  </style>
</head>
<body>
  <div class="topBit">
    <div class="bar">◀ &nbsp; ▶</div>

    <header>
      <h1>my youtube diary</h1>
    </header>

    <div class="layout">
      <aside>
        <div class="side-title">hi! <3 </div>
        <div class="side-note">
           pick a day and see what I watched lol
        </div>
      </aside>

      <main>
        <h2>I wonder what I watched on the day you picked?</h2>
        <div class="controls">
          <label for="datePicker">Choose a date:</label>
          <input type="date" id="datePicker">
          <button id="randomButton">Random Video</button>
        </div>

        <p id="message">click to show :0</p>
        <div id="video"></div>
      </main>
    </div>

  </div>

  <script>
    let videos = [];

    const datePicker = document.getElementById("datePicker");
    const randomButton = document.getElementById("randomButton");
    const message = document.getElementById("message");
    const videoArea = document.getElementById("video");

    datePicker.value = new Date().toLocaleDateString("en-CA");

    function prepareVideos(history) {
      return history
        .filter(item => item.titleUrl && item.titleUrl.includes("watch?v="))
        .map(item => ({
          title: item.title.replace(/^Watched /, ""),
          url: item.titleUrl,
          time: item.time
        }));
    }

    function getDate(video) {
      const date = new Date(video.time);
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return year + "-" + month + "-" + day;
    }

    function showRandomVideo() {
      const selectedDate = datePicker.value;

      if (!selectedDate) {
        message.textContent = "Please choose a date first.";
        videoArea.innerHTML = "";
        return;
      }

      const matchingVideos = videos.filter(video => getDate(video) === selectedDate);

      if (matchingVideos.length === 0) {
        message.textContent = "No videos found for this date. Try another date!";
        videoArea.innerHTML = "";
        return;
      }

      const randomIndex = Math.floor(Math.random() * matchingVideos.length);
      const video = matchingVideos[randomIndex];
      const videoId = new URL(video.url).searchParams.get("v");

      message.textContent = video.title;
      videoArea.innerHTML = '<iframe src="https://www.youtube.com/embed/' + videoId + '" title="YouTube video player" allowfullscreen></iframe>';
    }

    fetch("regular-videos.json")
      .then(response => response.json())
      .then(history => {
        videos = prepareVideos(history);
      })
      .catch(() => {
      });

    randomButton.addEventListener("click", showRandomVideo);
  </script>
</body>
</html>
